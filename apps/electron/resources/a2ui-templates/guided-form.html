<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A2UI Guided Form</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #f8fbfb; --bg-card: #ffffff; --bg-muted: #f0f7f7;
    --text: #1a1a1a; --text-secondary: #6b7280; --text-muted: #9ca3af;
    --accent: #10a37f; --accent-bg: #eff6f3; --accent-hover: #0d8c6d;
    --border: #e0e8e8; --hover-bg: #e6f0f0;
    --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px;
    --shadow-card: 0 1px 4px rgba(0,0,0,0.08);
    --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    --mono: ui-monospace, 'SF Mono', monospace;
  }
  body {
    font-family: var(--font); background: var(--bg); color: var(--text);
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }

  /* Progress bar */
  .progress-bar {
    height: 3px; background: var(--border); flex-shrink: 0;
  }
  .progress-fill {
    height: 100%; background: var(--accent); transition: width 0.4s ease;
  }

  /* Header */
  .header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    background: var(--bg-card); flex-shrink: 0;
  }
  .header h1 { font-size: 15px; font-weight: 600; }
  .header p { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

  /* Step container */
  .steps-viewport {
    flex: 1; position: relative; overflow: hidden;
  }
  .step {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: 40px 20px;
    opacity: 0; transform: translateX(60px); pointer-events: none;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .step.active {
    opacity: 1; transform: translateX(0); pointer-events: auto;
  }
  .step.exit-left {
    opacity: 0; transform: translateX(-60px); pointer-events: none;
  }
</style>
</head>
<body>
<div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
<div class="header">
  <h1 id="title"></h1>
  <p id="description"></p>
</div>
<div class="steps-viewport" id="viewport"></div>

<!-- Footer nav -->
<div class="footer" id="footer">
  <button class="btn-back" id="btn-back">Back</button>
  <span class="step-counter" id="step-counter"></span>
  <button class="btn-next" id="btn-next">Next</button>
</div>

<!-- Summary page (hidden until end) -->
<div class="summary-page" id="summary-page">
  <div class="summary-inner">
    <div class="summary-header">Review your answers</div>
    <div id="summary-list"></div>
    <div class="prompt-output">
      <div class="prompt-label">Generated prompt</div>
      <div class="prompt-text" id="prompt-text"></div>
      <button class="btn-copy" id="copy-btn">Copy</button>
    </div>
  </div>
</div>

<style>
  /* Step content */
  .step-question {
    font-size: 18px; font-weight: 600; text-align: center;
    max-width: 480px; margin-bottom: 8px; line-height: 1.4;
  }
  .step-hint {
    font-size: 13px; color: var(--text-muted); text-align: center;
    max-width: 400px; margin-bottom: 28px;
  }
  .step-input { width: 100%; max-width: 400px; }

  /* Choice buttons */
  .choices { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 400px; }
  .choice-btn {
    padding: 12px 16px; font-size: 14px; text-align: left;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius-md); cursor: pointer;
    font-family: var(--font); transition: all 0.15s; color: var(--text);
  }
  .choice-btn:hover { border-color: var(--accent); background: var(--accent-bg); }
  .choice-btn.selected { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); font-weight: 500; }

  /* Text input */
  .text-input {
    width: 100%; padding: 10px 14px; font-size: 14px;
    border: 1px solid var(--border); border-radius: var(--radius-md);
    background: var(--bg-card); color: var(--text); outline: none;
    font-family: var(--font); transition: border-color 0.15s;
  }
  .text-input:focus { border-color: var(--accent); }
  textarea.text-input { resize: vertical; min-height: 80px; line-height: 1.5; }

  /* Slider */
  .slider-wrap { width: 100%; max-width: 400px; }
  .slider-value {
    text-align: center; font-size: 28px; font-weight: 600;
    color: var(--accent); margin-bottom: 16px;
  }
  input[type="range"] {
    width: 100%; height: 4px; -webkit-appearance: none; appearance: none;
    background: var(--border); border-radius: 2px; outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 20px; height: 20px;
    background: white; border: 2px solid var(--accent); border-radius: 50%;
    cursor: pointer; box-shadow: var(--shadow-card);
  }
  .slider-labels {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--text-muted); margin-top: 8px;
  }

  /* Footer */
  .footer {
    padding: 12px 20px; border-top: 1px solid var(--border);
    background: var(--bg-card); display: flex; align-items: center;
    justify-content: space-between; flex-shrink: 0;
  }
  .btn-back, .btn-next {
    padding: 8px 20px; font-size: 13px; border-radius: var(--radius-md);
    cursor: pointer; font-family: var(--font); font-weight: 500;
    transition: all 0.15s; border: none;
  }
  .btn-back {
    background: transparent; color: var(--text-secondary);
  }
  .btn-back:hover { color: var(--text); }
  .btn-back:disabled { opacity: 0; pointer-events: none; }
  .btn-next {
    background: var(--accent); color: white;
  }
  .btn-next:hover { background: var(--accent-hover); }
  .btn-next:disabled { opacity: 0.4; cursor: default; }
  .step-counter { font-size: 12px; color: var(--text-muted); }

  /* Summary */
  .summary-page {
    position: absolute; inset: 0; top: 0; background: var(--bg);
    display: none; overflow-y: auto; z-index: 10;
  }
  .summary-page.visible { display: block; }
  .summary-inner { max-width: 520px; margin: 0 auto; padding: 32px 20px; }
  .summary-header {
    font-size: 18px; font-weight: 600; margin-bottom: 20px;
  }
  .summary-item {
    padding: 12px 0; border-bottom: 1px solid var(--border);
  }
  .summary-item-q { font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
  .summary-item-a { font-size: 14px; color: var(--text); font-weight: 500; }
  .summary-item-edit {
    font-size: 12px; color: var(--accent); cursor: pointer;
    margin-top: 4px; display: inline-block;
  }
  .summary-item-edit:hover { text-decoration: underline; }

  .prompt-output {
    margin-top: 24px; padding: 16px; background: var(--bg-muted);
    border-radius: var(--radius-lg); border: 1px solid var(--border);
  }
  .prompt-label { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
  .prompt-text {
    font-size: 13px; color: var(--text); font-family: var(--mono);
    white-space: pre-wrap; line-height: 1.6; margin-bottom: 12px;
  }
  .btn-copy {
    padding: 8px 20px; font-size: 13px; background: var(--accent);
    color: white; border: none; border-radius: var(--radius-md);
    cursor: pointer; font-family: var(--font); font-weight: 500;
    transition: background 0.15s;
  }
  .btn-copy:hover { background: var(--accent-hover); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 3px; }
</style>

<script>
const CONFIG = window.__A2UI_CONFIG__ || {};
const steps = CONFIG.steps || [];
const answers = {};
let current = 0;

function init() {
  document.getElementById('title').textContent = CONFIG.title || 'Guided Form';
  const descEl = document.getElementById('description');
  if (CONFIG.description) descEl.textContent = CONFIG.description;
  else descEl.style.display = 'none';

  // Build step elements
  steps.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'step' + (i === 0 ? ' active' : '');
    el.dataset.index = i;
    el.innerHTML = buildStepHTML(s);
    document.getElementById('viewport').appendChild(el);
  });

  updateNav();
  updateProgress();
  // Focus first input
  focusStep(0);
}

function buildStepHTML(s) {
  let html = `<div class="step-question">${esc(s.question)}</div>`;
  if (s.hint) html += `<div class="step-hint">${esc(s.hint)}</div>`;

  switch (s.type) {
    case 'choice':
      html += `<div class="choices">`;
      (s.options || []).forEach(o => {
        html += `<button class="choice-btn" data-value="${esc(o.value)}">${esc(o.label)}</button>`;
      });
      html += `</div>`;
      break;
    case 'multi-choice':
      html += `<div class="choices">`;
      (s.options || []).forEach(o => {
        html += `<button class="choice-btn" data-value="${esc(o.value)}">${esc(o.label)}</button>`;
      });
      html += `</div>`;
      break;
    case 'text':
      html += `<div class="step-input"><input class="text-input" type="text" placeholder="${esc(s.placeholder || '')}"></div>`;
      break;
    case 'textarea':
      html += `<div class="step-input"><textarea class="text-input" placeholder="${esc(s.placeholder || '')}" rows="4"></textarea></div>`;
      break;
    case 'slider':
      const val = s.defaultValue ?? s.min ?? 0;
      html += `<div class="slider-wrap">`;
      html += `<div class="slider-value">${val}${s.unit || ''}</div>`;
      html += `<input type="range" min="${s.min || 0}" max="${s.max || 100}" step="${s.step || 1}" value="${val}">`;
      html += `<div class="slider-labels"><span>${s.minLabel || s.min || 0}</span><span>${s.maxLabel || s.max || 100}</span></div>`;
      html += `</div>`;
      break;
  }
  return html;
}

function esc(str) {
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

// Event delegation
document.getElementById('viewport').addEventListener('click', e => {
  const btn = e.target.closest('.choice-btn');
  if (!btn) return;
  const step = steps[current];
  const val = btn.dataset.value;

  if (step.type === 'multi-choice') {
    btn.classList.toggle('selected');
    const selected = [...btn.parentElement.querySelectorAll('.choice-btn.selected')]
      .map(b => b.dataset.value);
    answers[step.id] = selected;
  } else {
    btn.parentElement.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    answers[step.id] = val;
    // Auto-advance on single choice after brief delay
    setTimeout(() => { if (current < steps.length - 1) goTo(current + 1); else showSummary(); }, 250);
  }
  updateNav();
});

document.getElementById('viewport').addEventListener('input', e => {
  const step = steps[current];
  if (e.target.matches('.text-input')) {
    answers[step.id] = e.target.value;
    updateNav();
  }
  if (e.target.matches('input[type="range"]')) {
    const v = Number(e.target.value);
    answers[step.id] = v;
    const wrap = e.target.closest('.slider-wrap');
    wrap.querySelector('.slider-value').textContent = v + (step.unit || '');
    const pct = ((v - (step.min||0)) / ((step.max||100) - (step.min||0))) * 100;
    e.target.style.background = `linear-gradient(to right, var(--accent) ${pct}%, var(--border) ${pct}%)`;
    updateNav();
  }
});

// Keyboard: Enter to advance
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    const summaryVisible = document.getElementById('summary-page').classList.contains('visible');
    if (summaryVisible) return;
    if (canAdvance()) {
      e.preventDefault();
      if (current < steps.length - 1) goTo(current + 1); else showSummary();
    }
  }
});

// Navigation
document.getElementById('btn-back').onclick = () => { if (current > 0) goTo(current - 1); };
document.getElementById('btn-next').onclick = () => {
  if (current < steps.length - 1) goTo(current + 1);
  else showSummary();
};

function goTo(idx) {
  const prev = current;
  current = idx;
  const allSteps = document.querySelectorAll('.step');
  allSteps.forEach((el, i) => {
    el.classList.remove('active', 'exit-left');
    if (i === idx) el.classList.add('active');
    else if (i < idx) el.classList.add('exit-left');
  });
  // Hide summary if going back
  document.getElementById('summary-page').classList.remove('visible');
  updateNav();
  updateProgress();
  focusStep(idx);
}

function focusStep(idx) {
  setTimeout(() => {
    const stepEl = document.querySelectorAll('.step')[idx];
    if (!stepEl) return;
    const input = stepEl.querySelector('.text-input');
    if (input) input.focus();
    // Restore slider fill
    const slider = stepEl.querySelector('input[type="range"]');
    if (slider) {
      const s = steps[idx];
      const v = answers[s.id] ?? s.defaultValue ?? s.min ?? 0;
      slider.value = v;
      const pct = ((v - (s.min||0)) / ((s.max||100) - (s.min||0))) * 100;
      slider.style.background = `linear-gradient(to right, var(--accent) ${pct}%, var(--border) ${pct}%)`;
    }
  }, 50);
}

function canAdvance() {
  const step = steps[current];
  const val = answers[step.id];
  if (step.type === 'multi-choice') return val && val.length > 0;
  if (step.type === 'slider') return true; // always has a value
  return val !== undefined && val !== '';
}

function updateNav() {
  document.getElementById('btn-back').disabled = current === 0;
  document.getElementById('btn-next').disabled = !canAdvance();
  document.getElementById('btn-next').textContent = current === steps.length - 1 ? 'Done' : 'Next';
  document.getElementById('step-counter').textContent = `${current + 1} / ${steps.length}`;
}

function updateProgress() {
  const pct = ((current + 1) / steps.length) * 100;
  document.getElementById('progress').style.width = pct + '%';
}

function showSummary() {
  const page = document.getElementById('summary-page');
  const list = document.getElementById('summary-list');
  list.innerHTML = '';
  steps.forEach((s, i) => {
    const item = document.createElement('div');
    item.className = 'summary-item';
    const val = answers[s.id];
    let display = '';
    if (Array.isArray(val)) {
      display = val.map(v => {
        const opt = (s.options||[]).find(o => o.value === v);
        return opt ? opt.label : v;
      }).join(', ');
    } else if (s.type === 'choice') {
      const opt = (s.options||[]).find(o => o.value === val);
      display = opt ? opt.label : (val || '—');
    } else if (s.type === 'slider') {
      display = (val ?? s.defaultValue ?? '') + (s.unit || '');
    } else {
      display = val || '—';
    }
    item.innerHTML = `
      <div class="summary-item-q">${esc(s.question)}</div>
      <div class="summary-item-a">${esc(display)}</div>
      <span class="summary-item-edit" data-goto="${i}">Edit</span>
    `;
    list.appendChild(item);
  });

  // Generate prompt
  if (CONFIG.promptTemplate) {
    document.getElementById('prompt-text').textContent = fillTemplate(CONFIG.promptTemplate);
  }

  page.classList.add('visible');
}

// Click "Edit" in summary to jump back
document.getElementById('summary-list').addEventListener('click', e => {
  const edit = e.target.closest('.summary-item-edit');
  if (edit) goTo(Number(edit.dataset.goto));
});

function fillTemplate(template) {
  return template.replace(/\{\{(\w+)\}\}/g, (_, id) => {
    const val = answers[id];
    if (Array.isArray(val)) return val.join(', ');
    return val !== undefined ? String(val) : `{{${id}}}`;
  });
}

// Copy button
document.getElementById('copy-btn').onclick = () => {
  const text = document.getElementById('prompt-text').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = '✓ Copied!';
    setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
  });
};

init();
</script>
</body>
</html>
