<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A2UI Playground</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #f8fbfb; --bg-card: #ffffff; --bg-muted: #f0f7f7;
    --text: #1a1a1a; --text-secondary: #6b7280; --text-muted: #9ca3af;
    --accent: #10a37f; --accent-bg: #eff6f3; --accent-hover: #0d8c6d;
    --border: #e0e8e8; --hover-bg: #e6f0f0;
    --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px;
    --shadow-card: 0 1px 4px rgba(0,0,0,0.08);
    --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    --mono: ui-monospace, 'SF Mono', monospace;
  }
  body { font-family: var(--font); background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }

  /* Header */
  .header { padding: 16px 20px; border-bottom: 1px solid var(--border); background: var(--bg-card); }
  .header h1 { font-size: 15px; font-weight: 600; color: var(--text); }
  .header p { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

  /* Main layout */
  .main { flex: 1; display: flex; overflow: hidden; }

  /* Controls panel */
  .controls {
    width: 280px; flex-shrink: 0; border-right: 1px solid var(--border);
    overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px;
    background: var(--bg-card);
  }

  /* Presets */
  .presets { display: flex; flex-wrap: wrap; gap: 6px; }
  .preset-btn {
    padding: 5px 12px; font-size: 13px; border-radius: 100px;
    border: 1px solid var(--border); background: var(--accent-bg); color: var(--accent);
    cursor: pointer; transition: all 0.15s; font-family: var(--font);
  }
  .preset-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }
  .preset-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
</style>
</head>
<body>
<div class="header">
  <h1 id="title"></h1>
  <p id="description"></p>
</div>
<div class="main">
  <div class="controls">
    <div id="presets-container"></div>
    <div id="controls-container"></div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
    <div id="preview" style="flex:1;overflow:auto;padding:20px;background:var(--bg);"></div>
    <div id="prompt-bar" style="border-top:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:8px;background:var(--bg-muted);">
      <div id="prompt-text" style="flex:1;font-size:13px;color:var(--text-secondary);font-family:var(--mono);white-space:pre-wrap;max-height:80px;overflow-y:auto;"></div>
      <button id="copy-btn" style="padding:6px 16px;font-size:13px;background:var(--accent);color:white;border:none;border-radius:var(--radius-md);cursor:pointer;flex-shrink:0;font-family:var(--font);font-weight:500;transition:background 0.15s;">Copy</button>
    </div>
  </div>
</div>
<style>
  #copy-btn:hover { background: var(--accent-hover); }

  /* Control group */
  .control-group { margin-bottom: 4px; }
  .control-group label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
  .control-group .value { float: right; font-family: var(--mono); font-size: 12px; color: var(--accent); }

  /* Slider */
  input[type="range"] {
    width: 100%; height: 4px; -webkit-appearance: none; appearance: none;
    background: var(--border); border-radius: 2px; outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px;
    background: white; border: 1px solid var(--border); border-radius: 50%;
    cursor: pointer; box-shadow: var(--shadow-card);
  }
  input[type="range"]:active::-webkit-slider-thumb { border-color: var(--accent); }
  /* Slider filled track via linear-gradient (set by JS) */

  /* Select */
  select {
    width: 100%; padding: 7px 10px; font-size: 13px;
    background: var(--bg-card); color: var(--text); border: 1px solid var(--border);
    border-radius: var(--radius-md); outline: none; cursor: pointer;
    font-family: var(--font);
  }
  select:focus { border-color: var(--accent); }

  /* Color picker */
  .color-picker-wrap {
    display: flex; align-items: center; gap: 10px;
  }
  .color-swatch {
    width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border);
    cursor: pointer; position: relative; overflow: hidden;
  }
  .color-swatch input { opacity: 0; position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; }
  .color-hex { font-family: var(--mono); font-size: 12px; color: var(--text-secondary); }

  /* Toggle */
  .toggle-wrap { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .toggle-track {
    width: 36px; height: 20px; border-radius: 10px; background: var(--border);
    position: relative; transition: background 0.15s; flex-shrink: 0;
  }
  .toggle-track.on { background: var(--accent); }
  .toggle-thumb {
    width: 16px; height: 16px; border-radius: 50%; background: white;
    position: absolute; top: 2px; left: 2px; transition: transform 0.15s;
    box-shadow: var(--shadow-card);
  }
  .toggle-track.on .toggle-thumb { transform: translateX(16px); }
  .toggle-label { font-size: 13px; color: var(--text); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.2); }
</style>
<script>
const CONFIG = window.__A2UI_CONFIG__ || {};
const state = {};

function init() {
  document.getElementById('title').textContent = CONFIG.title || 'Playground';
  const descEl = document.getElementById('description');
  if (CONFIG.description) descEl.textContent = CONFIG.description;
  else descEl.style.display = 'none';

  (CONFIG.controls || []).forEach(c => { state[c.id] = c.defaultValue; });

  renderPresets();
  renderControls();
  updateAll();
}

function renderPresets() {
  const container = document.getElementById('presets-container');
  if (!CONFIG.presets || CONFIG.presets.length === 0) { container.style.display = 'none'; return; }
  const wrap = document.createElement('div');
  wrap.className = 'presets';
  CONFIG.presets.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'preset-btn';
    btn.textContent = p.name;
    btn.title = p.description || '';
    btn.onclick = () => {
      Object.entries(p.values).forEach(([k, v]) => { state[k] = v; });
      syncControlsToState();
      updateAll();
      container.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
    wrap.appendChild(btn);
  });
  container.appendChild(wrap);
}

function renderControls() {
  const container = document.getElementById('controls-container');
  (CONFIG.controls || []).forEach(c => {
    const group = document.createElement('div');
    group.className = 'control-group';
    group.dataset.controlId = c.id;

    if (c.type !== 'toggle') {
      const label = document.createElement('label');
      label.innerHTML = `${c.label}<span class="value" id="val-${c.id}"></span>`;
      group.appendChild(label);
    }

    switch (c.type) {
      case 'slider': {
        const input = document.createElement('input');
        input.type = 'range';
        input.min = c.min; input.max = c.max;
        input.step = c.step || 1;
        input.value = c.defaultValue;
        const updateSliderFill = () => {
          const pct = ((input.value - c.min) / (c.max - c.min)) * 100;
          input.style.background = `linear-gradient(to right, var(--accent) ${pct}%, var(--border) ${pct}%)`;
        };
        input.oninput = () => { state[c.id] = Number(input.value); updateSliderFill(); updateAll(); };
        group.appendChild(input);
        setTimeout(updateSliderFill, 0);
        break;
      }
      case 'select': {
        const input = document.createElement('select');
        c.options.forEach(o => {
          const opt = document.createElement('option');
          opt.value = o.value; opt.textContent = o.label;
          if (o.value === c.defaultValue) opt.selected = true;
          input.appendChild(opt);
        });
        input.onchange = () => { state[c.id] = input.value; updateAll(); };
        group.appendChild(input);
        break;
      }
      case 'color': {
        const wrap = document.createElement('div');
        wrap.className = 'color-picker-wrap';
        const swatch = document.createElement('div');
        swatch.className = 'color-swatch';
        swatch.style.backgroundColor = c.defaultValue;
        const input = document.createElement('input');
        input.type = 'color'; input.value = c.defaultValue;
        const hex = document.createElement('span');
        hex.className = 'color-hex';
        hex.textContent = c.defaultValue;
        input.oninput = () => {
          state[c.id] = input.value;
          swatch.style.backgroundColor = input.value;
          hex.textContent = input.value;
          updateAll();
        };
        swatch.appendChild(input);
        wrap.appendChild(swatch);
        wrap.appendChild(hex);
        group.appendChild(wrap);
        break;
      }
      case 'toggle': {
        const wrap = document.createElement('div');
        wrap.className = 'toggle-wrap';
        const track = document.createElement('div');
        track.className = 'toggle-track' + (c.defaultValue ? ' on' : '');
        const thumb = document.createElement('div');
        thumb.className = 'toggle-thumb';
        track.appendChild(thumb);
        const lbl = document.createElement('span');
        lbl.className = 'toggle-label';
        lbl.textContent = c.label;
        wrap.appendChild(track);
        wrap.appendChild(lbl);
        wrap.onclick = () => {
          state[c.id] = !state[c.id];
          track.classList.toggle('on', state[c.id]);
          updateAll();
        };
        group.appendChild(wrap);
        break;
      }
    }
    container.appendChild(group);
  });
}

function syncControlsToState() {
  (CONFIG.controls || []).forEach(c => {
    const group = document.querySelector(`[data-control-id="${c.id}"]`);
    if (!group) return;
    const val = state[c.id];
    switch (c.type) {
      case 'slider': {
        const input = group.querySelector('input');
        input.value = val;
        const pct = ((val - c.min) / (c.max - c.min)) * 100;
        input.style.background = `linear-gradient(to right, var(--accent) ${pct}%, var(--border) ${pct}%)`;
        break;
      }
      case 'select': group.querySelector('select').value = val; break;
      case 'color': {
        group.querySelector('input').value = val;
        group.querySelector('.color-swatch').style.backgroundColor = val;
        group.querySelector('.color-hex').textContent = val;
        break;
      }
      case 'toggle': group.querySelector('.toggle-track').classList.toggle('on', val); break;
    }
  });
}

function fillTemplate(template) {
  return template.replace(/\{\{(\w+)\}\}/g, (_, id) => {
    const val = state[id];
    return val !== undefined ? String(val) : `{{${id}}}`;
  });
}

function updateAll() {
  (CONFIG.controls || []).forEach(c => {
    const valEl = document.getElementById(`val-${c.id}`);
    if (!valEl) return;
    const v = state[c.id];
    if (c.type === 'slider') valEl.textContent = v + (c.unit || '');
    else if (c.type === 'toggle') valEl.textContent = v ? 'On' : 'Off';
    else valEl.textContent = String(v);
  });

  if (CONFIG.previewTemplate) {
    document.getElementById('preview').innerHTML = fillTemplate(CONFIG.previewTemplate);
  }
  if (CONFIG.promptTemplate) {
    document.getElementById('prompt-text').textContent = fillTemplate(CONFIG.promptTemplate);
  }
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
}

document.getElementById('copy-btn').onclick = () => {
  const text = document.getElementById('prompt-text').textContent;
  window.parent.postMessage({ type: 'a2ui-copy', text }, '*');
  const btn = document.getElementById('copy-btn');
  btn.textContent = '✓ Copied!';
  setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
};

init();
</script>
</body>
</html>
