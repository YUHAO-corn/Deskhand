<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A2UI Playground</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #1a1a2e; --bg-surface: #16213e; --bg-card: #0f3460;
    --text: #e4e4e7; --text-muted: #a1a1aa; --text-dim: #71717a;
    --accent: #3b82f6; --accent-hover: #2563eb;
    --border: #27272a; --radius: 8px;
    --font: system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, 'SF Mono', monospace;
  }
  body { font-family: var(--font); background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }

  /* Header */
  .header { padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .header h1 { font-size: 16px; font-weight: 600; }
  .header p { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

  /* Main layout */
  .main { flex: 1; display: flex; overflow: hidden; }

  /* Controls panel */
  .controls { width: 280px; flex-shrink: 0; border-right: 1px solid var(--border); overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }

  /* Presets */
  .presets { display: flex; flex-wrap: wrap; gap: 6px; }
  .preset-btn {
    padding: 4px 10px; font-size: 11px; border-radius: 100px;
    border: 1px solid var(--border); background: transparent; color: var(--text-muted);
    cursor: pointer; transition: all 0.15s;
  }
  .preset-btn:hover { border-color: var(--accent); color: var(--accent); }
  .preset-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

  /* Control group */
  .control-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .control-group .value { float: right; font-family: var(--mono); font-size: 11px; color: var(--accent); }

  /* Slider */
  input[type="range"] {
    width: 100%; height: 4px; -webkit-appearance: none; appearance: none;
    background: var(--border); border-radius: 2px; outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    background: var(--accent); border-radius: 50%; cursor: pointer;
  }

  /* Select */
  select {
    width: 100%; padding: 6px 8px; font-size: 12px;
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: var(--radius); outline: none; cursor: pointer;
  }
  select:focus { border-color: var(--accent); }
</style>
</head>
<body>
<div class="header">
  <h1 id="title"></h1>
  <p id="description"></p>
</div>
<div class="main">
  <div class="controls">
    <div id="presets-container"></div>
    <div id="controls-container"></div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
    <div id="preview" style="flex:1;overflow:auto;padding:20px;"></div>
    <div id="prompt-bar" style="border-top:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:8px;">
      <div id="prompt-text" style="flex:1;font-size:12px;color:var(--text-muted);font-family:var(--mono);white-space:pre-wrap;max-height:80px;overflow-y:auto;"></div>
      <button id="copy-btn" style="padding:6px 14px;font-size:12px;background:var(--accent);color:white;border:none;border-radius:var(--radius);cursor:pointer;flex-shrink:0;">Copy</button>
    </div>
  </div>
</div>
<script>
// Config is injected by the frontend before rendering
const CONFIG = window.__A2UI_CONFIG__ || {};
const state = {};

function init() {
  document.getElementById('title').textContent = CONFIG.title || 'Playground';
  const descEl = document.getElementById('description');
  if (CONFIG.description) descEl.textContent = CONFIG.description;
  else descEl.style.display = 'none';

  // Initialize state with defaults
  (CONFIG.controls || []).forEach(c => {
    state[c.id] = c.defaultValue;
  });

  renderPresets();
  renderControls();
  updateAll();
}

function renderPresets() {
  const container = document.getElementById('presets-container');
  if (!CONFIG.presets || CONFIG.presets.length === 0) { container.style.display = 'none'; return; }
  const wrap = document.createElement('div');
  wrap.className = 'presets';
  CONFIG.presets.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'preset-btn';
    btn.textContent = p.name;
    btn.title = p.description || '';
    btn.onclick = () => {
      Object.entries(p.values).forEach(([k, v]) => { state[k] = v; });
      syncControlsToState();
      updateAll();
      // Highlight active preset
      container.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
    wrap.appendChild(btn);
  });
  container.appendChild(wrap);
}

function renderControls() {
  const container = document.getElementById('controls-container');
  (CONFIG.controls || []).forEach(c => {
    const group = document.createElement('div');
    group.className = 'control-group';
    group.dataset.controlId = c.id;

    const label = document.createElement('label');
    label.innerHTML = `${c.label}<span class="value" id="val-${c.id}"></span>`;
    group.appendChild(label);

    let input;
    switch (c.type) {
      case 'slider':
        input = document.createElement('input');
        input.type = 'range';
        input.min = c.min; input.max = c.max;
        input.step = c.step || 1;
        input.value = c.defaultValue;
        input.oninput = () => { state[c.id] = Number(input.value); updateAll(); };
        break;
      case 'select':
        input = document.createElement('select');
        c.options.forEach(o => {
          const opt = document.createElement('option');
          opt.value = o.value; opt.textContent = o.label;
          if (o.value === c.defaultValue) opt.selected = true;
          input.appendChild(opt);
        });
        input.onchange = () => { state[c.id] = input.value; updateAll(); };
        break;
      case 'color':
        input = document.createElement('input');
        input.type = 'color'; input.value = c.defaultValue;
        input.style.cssText = 'width:100%;height:32px;border:1px solid var(--border);border-radius:var(--radius);background:transparent;cursor:pointer;';
        input.oninput = () => { state[c.id] = input.value; updateAll(); };
        break;
      case 'toggle':
        input = document.createElement('label');
        input.style.cssText = 'display:flex;align-items:center;gap:8px;cursor:pointer;';
        const cb = document.createElement('input');
        cb.type = 'checkbox'; cb.checked = c.defaultValue;
        cb.onchange = () => { state[c.id] = cb.checked; updateAll(); };
        input.appendChild(cb);
        input.appendChild(document.createTextNode(c.defaultValue ? 'On' : 'Off'));
        break;
    }
    if (input) group.appendChild(input);
    container.appendChild(group);
  });
}

function syncControlsToState() {
  (CONFIG.controls || []).forEach(c => {
    const group = document.querySelector(`[data-control-id="${c.id}"]`);
    if (!group) return;
    const val = state[c.id];
    switch (c.type) {
      case 'slider': group.querySelector('input').value = val; break;
      case 'select': group.querySelector('select').value = val; break;
      case 'color': group.querySelector('input').value = val; break;
      case 'toggle': group.querySelector('input[type="checkbox"]').checked = val; break;
    }
  });
}

function fillTemplate(template) {
  return template.replace(/\{\{(\w+)\}\}/g, (_, id) => {
    const val = state[id];
    return val !== undefined ? String(val) : `{{${id}}}`;
  });
}

function updateAll() {
  // Update value displays
  (CONFIG.controls || []).forEach(c => {
    const valEl = document.getElementById(`val-${c.id}`);
    if (!valEl) return;
    const v = state[c.id];
    if (c.type === 'slider') valEl.textContent = v + (c.unit || '');
    else if (c.type === 'toggle') valEl.textContent = v ? 'On' : 'Off';
    else valEl.textContent = String(v);
  });

  // Update preview
  if (CONFIG.previewTemplate) {
    document.getElementById('preview').innerHTML = fillTemplate(CONFIG.previewTemplate);
  }

  // Update prompt
  if (CONFIG.promptTemplate) {
    document.getElementById('prompt-text').textContent = fillTemplate(CONFIG.promptTemplate);
  }

  // Clear active preset
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
}

// Copy button
document.getElementById('copy-btn').onclick = () => {
  const text = document.getElementById('prompt-text').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
  });
};

init();
</script>
</body>
</html>
