<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A2UI Playground</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --a2ui-bg-canvas: #f4efe6;
    --a2ui-bg-panel: #fff9f0;
    --a2ui-bg-elevated: #fffdf7;
    --a2ui-bg-soft: #f3eee3;
    --a2ui-text-strong: #1f2522;
    --a2ui-text-normal: #4f5a54;
    --a2ui-text-muted: #6a746d;
    --a2ui-line: #d6cec0;
    --a2ui-line-strong: #c8bda9;
    --a2ui-accent: #0b6a60;
    --a2ui-accent-strong: #084d46;
    --a2ui-accent-soft: #e9f6f3;
    --a2ui-shadow-soft: 0 10px 30px rgba(31, 37, 34, 0.08);
    --a2ui-shadow-elevated: 0 16px 40px rgba(31, 37, 34, 0.14);
    --radius-xs: 8px;
    --radius-sm: 12px;
    --radius-md: 16px;
    --radius-lg: 22px;
    --font-display: 'Fraunces', 'Iowan Old Style', 'Times New Roman', serif;
    --font-body: 'IBM Plex Sans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --font-mono: 'IBM Plex Mono', 'SFMono-Regular', ui-monospace, monospace;
    --ease-out: cubic-bezier(0.2, 0.84, 0.24, 1);
  }

  body {
    font-family: var(--font-body);
    min-height: 100vh;
    color: var(--a2ui-text-strong);
    background:
      radial-gradient(1200px 500px at 8% -12%, rgba(11, 106, 96, 0.2), transparent 55%),
      radial-gradient(950px 450px at 92% -20%, rgba(164, 126, 59, 0.2), transparent 58%),
      var(--a2ui-bg-canvas);
    -webkit-font-smoothing: antialiased;
  }

  .page-shell {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 14px;
    gap: 12px;
  }

  .header {
    background: linear-gradient(145deg, rgba(255, 253, 247, 0.9), rgba(255, 249, 240, 0.96));
    border: 1px solid var(--a2ui-line);
    border-radius: var(--radius-lg);
    box-shadow: var(--a2ui-shadow-soft);
    padding: 16px 18px;
    animation: lift-in 0.35s var(--ease-out);
  }

  .header-main {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
  }

  .kicker {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--a2ui-accent);
    font-weight: 600;
    margin-bottom: 5px;
  }

  .header h1 {
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.1;
  }

  .header p {
    font-size: 13px;
    color: var(--a2ui-text-muted);
    line-height: 1.5;
    margin-top: 7px;
    max-width: 62ch;
  }

  .mode-pill {
    display: inline-flex;
    align-items: center;
    border-radius: 999px;
    border: 1px solid var(--a2ui-line);
    background: var(--a2ui-bg-elevated);
    color: var(--a2ui-text-normal);
    padding: 6px 12px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 600;
    white-space: nowrap;
  }

  .main {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(292px, 320px) minmax(0, 1fr);
    gap: 12px;
    animation: lift-in 0.4s var(--ease-out) both;
  }

  .controls-panel {
    min-height: 0;
    overflow: auto;
    padding: 14px;
    border: 1px solid var(--a2ui-line);
    border-radius: var(--radius-lg);
    background: linear-gradient(180deg, rgba(255, 253, 247, 0.95), rgba(255, 249, 240, 0.92));
    box-shadow: var(--a2ui-shadow-soft);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .panel-block {
    border: 1px solid var(--a2ui-line);
    border-radius: var(--radius-md);
    background: var(--a2ui-bg-elevated);
    padding: 10px;
  }

  .block-head {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--a2ui-text-muted);
    font-weight: 600;
    margin-bottom: 8px;
    padding-left: 2px;
  }

  .controls-stack {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .preview-area {
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .stage-wrap {
    flex: 1;
    min-height: 0;
    border: 1px solid var(--a2ui-line);
    border-radius: var(--radius-lg);
    background: var(--a2ui-bg-panel);
    box-shadow: var(--a2ui-shadow-soft);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .stage-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    border-bottom: 1px solid var(--a2ui-line);
    padding: 10px 14px;
    font-size: 12px;
    color: var(--a2ui-text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
  }

  .stage-chip {
    border-radius: 999px;
    border: 1px solid rgba(11, 106, 96, 0.28);
    background: var(--a2ui-accent-soft);
    color: var(--a2ui-accent);
    font-size: 11px;
    letter-spacing: 0;
    text-transform: none;
    padding: 3px 10px;
    font-weight: 500;
  }

  .preview-content {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 20px;
    background:
      linear-gradient(180deg, rgba(255, 253, 247, 0.82), rgba(255, 249, 240, 0.64));
  }

  .preview-summary {
    max-width: 560px;
    margin: 0 auto;
    display: grid;
    gap: 8px;
  }

  .preview-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--a2ui-line);
    background: var(--a2ui-bg-elevated);
    font-size: 13px;
    color: var(--a2ui-text-normal);
  }

  .preview-value {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    color: var(--a2ui-accent);
    font-size: 12px;
    font-weight: 500;
  }

  .preview-swatch {
    width: 14px;
    height: 14px;
    border-radius: 4px;
    border: 1px solid var(--a2ui-line);
  }

  .placeholder {
    height: 100%;
    min-height: 220px;
    display: grid;
    place-items: center;
    color: var(--a2ui-text-muted);
    font-size: 14px;
  }

  .prompt-bar {
    border: 1px solid var(--a2ui-line);
    border-radius: var(--radius-lg);
    background: linear-gradient(180deg, rgba(255, 253, 247, 0.96), rgba(255, 249, 240, 0.94));
    box-shadow: var(--a2ui-shadow-soft);
    padding: 10px;
  }

  .prompt-label {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--a2ui-text-muted);
    font-weight: 600;
    margin-bottom: 8px;
    padding-left: 2px;
  }

  .prompt-inner {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    border: 1px solid var(--a2ui-line);
    border-radius: var(--radius-md);
    background: var(--a2ui-bg-elevated);
    padding: 10px;
  }

  .prompt-text {
    flex: 1;
    min-height: 40px;
    max-height: 110px;
    overflow-y: auto;
    font-size: 12px;
    line-height: 1.55;
    color: var(--a2ui-text-normal);
    font-family: var(--font-mono);
    white-space: pre-wrap;
  }

  .send-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    border: 1px solid var(--a2ui-accent);
    border-radius: 999px;
    background: linear-gradient(180deg, var(--a2ui-accent), var(--a2ui-accent-strong));
    color: #f8fffc;
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 600;
    padding: 8px 14px;
    cursor: pointer;
    transition: transform 0.18s var(--ease-out), box-shadow 0.18s var(--ease-out), filter 0.18s var(--ease-out);
    flex-shrink: 0;
  }

  .send-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 22px rgba(11, 106, 96, 0.28);
    filter: brightness(1.03);
  }

  .send-btn:active { transform: translateY(0); }

  .send-btn.sent {
    border-color: #2f7b5f;
    background: linear-gradient(180deg, #3e9675, #2f7b5f);
    box-shadow: 0 8px 20px rgba(63, 151, 116, 0.24);
  }

  .presets { display: flex; flex-wrap: wrap; gap: 7px; }

  .preset-btn {
    border: 1px solid var(--a2ui-line);
    border-radius: 999px;
    background: var(--a2ui-bg-soft);
    color: var(--a2ui-text-normal);
    font-size: 12px;
    font-weight: 500;
    padding: 6px 12px;
    cursor: pointer;
    transition: all 0.2s var(--ease-out);
    font-family: var(--font-body);
  }

  .preset-btn:hover {
    border-color: rgba(11, 106, 96, 0.4);
    background: var(--a2ui-accent-soft);
    color: var(--a2ui-accent);
    transform: translateY(-1px);
  }

  .preset-btn.active {
    border-color: var(--a2ui-accent);
    background: var(--a2ui-accent);
    color: #f4fffd;
    box-shadow: 0 8px 20px rgba(11, 106, 96, 0.2);
  }

  .control-group {
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    padding: 10px;
    transition: border-color 0.18s var(--ease-out), background 0.18s var(--ease-out), transform 0.18s var(--ease-out);
    animation: fade-up 0.28s var(--ease-out) both;
  }

  .control-group:hover {
    border-color: rgba(11, 106, 96, 0.2);
    background: rgba(11, 106, 96, 0.03);
    transform: translateY(-1px);
  }

  .control-group label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    color: var(--a2ui-text-normal);
    font-size: 12px;
    font-weight: 500;
    gap: 10px;
  }

  .control-group .value {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--a2ui-accent);
    background: var(--a2ui-accent-soft);
    border: 1px solid rgba(11, 106, 96, 0.2);
    border-radius: 999px;
    padding: 1px 7px;
    white-space: nowrap;
  }

  input[type="range"] {
    width: 100%;
    height: 6px;
    appearance: none;
    border-radius: 999px;
    background: var(--a2ui-line);
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fefcf6;
    border: 2px solid var(--a2ui-accent);
    box-shadow: 0 4px 10px rgba(11, 106, 96, 0.22);
    cursor: pointer;
    transition: transform 0.15s var(--ease-out);
  }

  input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.1);
  }

  select {
    width: 100%;
    border: 1px solid var(--a2ui-line);
    border-radius: var(--radius-xs);
    background: var(--a2ui-bg-elevated);
    color: var(--a2ui-text-strong);
    font-family: var(--font-body);
    font-size: 13px;
    padding: 8px 11px;
    outline: none;
    transition: border-color 0.18s var(--ease-out), box-shadow 0.18s var(--ease-out);
  }

  select:focus {
    border-color: rgba(11, 106, 96, 0.42);
    box-shadow: 0 0 0 3px rgba(11, 106, 96, 0.12);
  }

  .color-picker-wrap { display: flex; align-items: center; gap: 10px; }

  .color-swatch {
    width: 34px;
    height: 34px;
    border-radius: var(--radius-xs);
    border: 1px solid var(--a2ui-line);
    overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.6);
    position: relative;
  }

  .color-swatch input {
    opacity: 0;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    cursor: pointer;
  }

  .color-hex {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--a2ui-text-muted);
  }

  .toggle-wrap {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }

  .toggle-track {
    width: 40px;
    height: 22px;
    border-radius: 999px;
    background: #d6d1c6;
    position: relative;
    transition: background 0.2s var(--ease-out);
    border: 1px solid var(--a2ui-line);
  }

  .toggle-track.on {
    background: var(--a2ui-accent);
    border-color: var(--a2ui-accent);
  }

  .toggle-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fffdf8;
    position: absolute;
    top: 2px;
    left: 2px;
    transition: transform 0.2s var(--ease-out);
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }

  .toggle-track.on .toggle-thumb { transform: translateX(18px); }

  .toggle-label {
    color: var(--a2ui-text-normal);
    font-size: 13px;
  }

  .options-grid {
    display: grid;
    gap: 7px;
  }

  .option-card {
    border: 1px solid var(--a2ui-line);
    border-radius: var(--radius-sm);
    background: var(--a2ui-bg-elevated);
    padding: 10px 12px;
    cursor: pointer;
    transition: all 0.18s var(--ease-out);
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
    animation: fade-up 0.25s var(--ease-out) both;
  }

  .option-card:hover {
    border-color: rgba(11, 106, 96, 0.35);
    background: rgba(11, 106, 96, 0.04);
    transform: translateY(-1px);
  }

  .option-card.selected {
    border-color: var(--a2ui-accent);
    background: var(--a2ui-accent-soft);
    box-shadow: 0 6px 18px rgba(11, 106, 96, 0.14);
  }

  .option-text {
    min-width: 0;
    flex: 1;
  }

  .option-label {
    font-size: 13px;
    color: var(--a2ui-text-strong);
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .option-desc {
    margin-top: 2px;
    font-size: 11px;
    color: var(--a2ui-text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .option-check {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    display: none;
    align-items: center;
    justify-content: center;
    background: var(--a2ui-accent);
    color: #fff;
    flex-shrink: 0;
  }

  .option-card.selected .option-check { display: inline-flex; }

  .empty-note {
    font-size: 12px;
    color: var(--a2ui-text-muted);
    padding: 8px;
    border-radius: var(--radius-sm);
    border: 1px dashed var(--a2ui-line);
    background: var(--a2ui-bg-soft);
  }

  @keyframes lift-in {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fade-up {
    from { opacity: 0; transform: translateY(7px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 980px) {
    .main {
      grid-template-columns: 1fr;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .controls-panel {
      max-height: 38vh;
    }

    .header-main {
      flex-direction: column;
      align-items: flex-start;
    }

    .header h1 {
      font-size: 21px;
    }

    .prompt-inner {
      flex-direction: column;
      align-items: stretch;
    }

    .send-btn {
      width: 100%;
    }
  }

  ::-webkit-scrollbar { width: 7px; height: 7px; }
  ::-webkit-scrollbar-thumb { background: rgba(84, 87, 77, 0.24); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(84, 87, 77, 0.34); }
</style>
</head>
<body>
<div class="page-shell">
  <header class="header">
    <div class="header-main">
      <div>
        <p class="kicker">A2UI Lab</p>
        <h1 id="title"></h1>
        <p id="description"></p>
      </div>
      <span class="mode-pill" id="mode-pill">Controls Studio</span>
    </div>
  </header>

  <section class="main" id="controls-layout">
    <aside class="controls-panel">
      <div class="panel-block">
        <div class="block-head">Presets</div>
        <div id="presets-container"></div>
      </div>
      <div class="panel-block">
        <div class="block-head">Controls</div>
        <div id="controls-container" class="controls-stack"></div>
      </div>
    </aside>

    <div class="preview-area">
      <div class="stage-wrap">
        <div class="stage-head">
          <span>Preview Stage</span>
        </div>
        <div id="preview" class="preview-content"></div>
      </div>

      <div class="prompt-bar">
        <div class="prompt-label">Prompt Composer</div>
        <div class="prompt-inner">
          <div id="prompt-text" class="prompt-text"></div>
          <button id="copy-btn" class="send-btn">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="flex-shrink:0">
              <path d="M1 7h9.5M7.5 3.5L11 7l-3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Send to Chat</span>
          </button>
        </div>
      </div>
    </div>
  </section>

  <section class="main" id="options-layout" style="display:none">
    <aside class="controls-panel">
      <div class="panel-block">
        <div class="block-head">Options</div>
        <div id="options-grid" class="options-grid"></div>
      </div>
      <div id="options-controls" class="panel-block" style="display:none">
        <div class="block-head">Fine Tune</div>
        <div id="options-controls-container" class="controls-stack"></div>
      </div>
    </aside>

    <div class="preview-area">
      <div class="stage-wrap">
        <div class="stage-head">
          <span>Selection Preview</span>
          <span class="stage-chip" id="selected-option-chip">Ready</span>
        </div>
        <div id="options-preview" class="preview-content"></div>
      </div>

      <div class="prompt-bar">
        <div class="prompt-label">Prompt Composer</div>
        <div class="prompt-inner">
          <div id="options-prompt-text" class="prompt-text"></div>
          <button id="options-copy-btn" class="send-btn">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="flex-shrink:0">
              <path d="M1 7h9.5M7.5 3.5L11 7l-3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Send to Chat</span>
          </button>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
const CONFIG = window.__A2UI_CONFIG__ || {};
const state = {};
const isOptionsMode = CONFIG.options && CONFIG.options.length > 0;

/** Sync a control value to a CSS variable on :root */
function syncCssVar(id, value, unit) {
  const cssVal = typeof value === 'boolean' ? (value ? '1' : '0') : String(value) + (unit || '');
  document.documentElement.style.setProperty('--' + id, cssVal);
}

function init() {
  document.getElementById('title').textContent = CONFIG.title || 'Playground';
  const descEl = document.getElementById('description');
  if (CONFIG.description) {
    descEl.textContent = CONFIG.description;
  } else {
    descEl.style.display = 'none';
  }

  // Initialize control state and CSS variables
  (CONFIG.controls || []).forEach(c => {
    state[c.id] = c.defaultValue;
    syncCssVar(c.id, c.defaultValue, c.unit);
  });

  if (isOptionsMode) {
    document.getElementById('mode-pill').textContent = 'Options Gallery';
    document.getElementById('controls-layout').style.display = 'none';
    document.getElementById('options-layout').style.display = 'grid';
    state.selected = CONFIG.options[0].id;
    state.selectedLabel = CONFIG.options[0].label;
    renderOptions();

    if (CONFIG.controls && CONFIG.controls.length > 0) {
      document.getElementById('options-controls').style.display = 'block';
      renderControlsInto(document.getElementById('options-controls-container'));
    }
    updateOptionsMode();
  } else {
    document.getElementById('mode-pill').textContent = 'Controls Studio';
    renderPresets();
    renderControlsInto(document.getElementById('controls-container'));
    updateAll();
  }
}

function renderOptions() {
  const grid = document.getElementById('options-grid');
  grid.innerHTML = '';

  CONFIG.options.forEach((opt, i) => {
    const card = document.createElement('div');
    card.className = 'option-card' + (i === 0 ? ' selected' : '');
    card.dataset.optionId = opt.id;
    card.style.animationDelay = (i * 0.03) + 's';

    const text = document.createElement('div');
    text.className = 'option-text';

    const label = document.createElement('div');
    label.className = 'option-label';
    label.textContent = opt.label;
    text.appendChild(label);

    if (opt.description) {
      const desc = document.createElement('div');
      desc.className = 'option-desc';
      desc.textContent = opt.description;
      text.appendChild(desc);
    }

    card.appendChild(text);

    const check = document.createElement('div');
    check.className = 'option-check';
    check.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>';
    card.appendChild(check);

    card.onclick = () => {
      state.selected = opt.id;
      state.selectedLabel = opt.label;
      grid.querySelectorAll('.option-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      updateOptionsMode();
    };

    grid.appendChild(card);
  });
}

function updateOptionsMode() {
  const selectedOpt = CONFIG.options.find(o => o.id === state.selected);
  const previewEl = document.getElementById('options-preview');
  const selectedChip = document.getElementById('selected-option-chip');

  if (selectedOpt) {
    const html = selectedOpt.previewHtml || CONFIG.previewHtml ||
      `<div class="placeholder">${selectedOpt.label}</div>`;
    previewEl.innerHTML = html;
    selectedChip.textContent = selectedOpt.label;
  }

  (CONFIG.controls || []).forEach(c => syncCssVar(c.id, state[c.id], c.unit));

  const parts = [];
  if (selectedOpt) {
    parts.push(`I chose: ${selectedOpt.label}${selectedOpt.description ? ' — ' + selectedOpt.description : ''}`);
  }
  (CONFIG.controls || []).forEach(c => {
    const v = state[c.id];
    const display = c.type === 'toggle' ? (v ? 'Yes' : 'No') : c.type === 'slider' ? v + (c.unit || '') : String(v);
    parts.push(`${c.label}: ${display}`);
  });

  document.getElementById('options-prompt-text').textContent = parts.join('\n');

  (CONFIG.controls || []).forEach(c => {
    const valEl = document.getElementById(`val-${c.id}`);
    if (!valEl) return;
    const v = state[c.id];
    if (c.type === 'slider') valEl.textContent = v + (c.unit || '');
    else if (c.type === 'toggle') valEl.textContent = v ? 'On' : 'Off';
    else valEl.textContent = String(v);
  });
}

function renderPresets() {
  const container = document.getElementById('presets-container');
  container.innerHTML = '';

  if (!CONFIG.presets || CONFIG.presets.length === 0) {
    container.innerHTML = '<div class="empty-note">No presets configured</div>';
    return;
  }

  const wrap = document.createElement('div');
  wrap.className = 'presets';

  CONFIG.presets.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'preset-btn';
    btn.textContent = p.name;
    btn.title = p.description || '';
    btn.onclick = () => {
      Object.entries(p.values).forEach(([k, v]) => { state[k] = v; });
      syncControlsToState();
      updateAll();
      container.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
    wrap.appendChild(btn);
  });

  container.appendChild(wrap);
}

function renderControlsInto(container) {
  (CONFIG.controls || []).forEach((c, i) => {
    const group = document.createElement('div');
    group.className = 'control-group';
    group.dataset.controlId = c.id;
    group.style.animationDelay = (i * 0.04) + 's';

    if (c.type !== 'toggle') {
      const label = document.createElement('label');
      label.innerHTML = `${c.label}<span class="value" id="val-${c.id}"></span>`;
      group.appendChild(label);
    }

    switch (c.type) {
      case 'slider': {
        const input = document.createElement('input');
        input.type = 'range';
        input.min = c.min;
        input.max = c.max;
        input.step = c.step || 1;
        input.value = c.defaultValue;

        const updateFill = () => {
          const pct = ((input.value - c.min) / (c.max - c.min)) * 100;
          input.style.background = `linear-gradient(to right, var(--a2ui-accent) ${pct}%, var(--a2ui-line) ${pct}%)`;
        };

        input.oninput = () => {
          state[c.id] = Number(input.value);
          updateFill();
          updateAll();
        };

        group.appendChild(input);
        setTimeout(updateFill, 0);
        break;
      }

      case 'select': {
        const input = document.createElement('select');
        c.options.forEach(o => {
          const opt = document.createElement('option');
          opt.value = o.value;
          opt.textContent = o.label;
          if (o.value === c.defaultValue) opt.selected = true;
          input.appendChild(opt);
        });
        input.onchange = () => {
          state[c.id] = input.value;
          updateAll();
        };
        group.appendChild(input);
        break;
      }

      case 'color': {
        const wrap = document.createElement('div');
        wrap.className = 'color-picker-wrap';
        const swatch = document.createElement('div');
        swatch.className = 'color-swatch';
        swatch.style.backgroundColor = c.defaultValue;
        const input = document.createElement('input');
        input.type = 'color';
        input.value = c.defaultValue;
        const hex = document.createElement('span');
        hex.className = 'color-hex';
        hex.textContent = c.defaultValue;
        input.oninput = () => {
          state[c.id] = input.value;
          swatch.style.backgroundColor = input.value;
          hex.textContent = input.value;
          updateAll();
        };
        swatch.appendChild(input);
        wrap.appendChild(swatch);
        wrap.appendChild(hex);
        group.appendChild(wrap);
        break;
      }

      case 'toggle': {
        const wrap = document.createElement('div');
        wrap.className = 'toggle-wrap';
        const track = document.createElement('div');
        track.className = 'toggle-track' + (c.defaultValue ? ' on' : '');
        const thumb = document.createElement('div');
        thumb.className = 'toggle-thumb';
        track.appendChild(thumb);
        const lbl = document.createElement('span');
        lbl.className = 'toggle-label';
        lbl.textContent = c.label;
        wrap.appendChild(track);
        wrap.appendChild(lbl);
        wrap.onclick = () => {
          state[c.id] = !state[c.id];
          track.classList.toggle('on', state[c.id]);
          updateAll();
        };
        group.appendChild(wrap);
        break;
      }
    }

    container.appendChild(group);
  });
}

function syncControlsToState() {
  (CONFIG.controls || []).forEach(c => {
    const group = document.querySelector(`[data-control-id="${c.id}"]`);
    if (!group) return;
    const val = state[c.id];
    switch (c.type) {
      case 'slider': {
        const input = group.querySelector('input');
        input.value = val;
        const pct = ((val - c.min) / (c.max - c.min)) * 100;
        input.style.background = `linear-gradient(to right, var(--a2ui-accent) ${pct}%, var(--a2ui-line) ${pct}%)`;
        break;
      }
      case 'select':
        group.querySelector('select').value = val;
        break;
      case 'color':
        group.querySelector('input').value = val;
        group.querySelector('.color-swatch').style.backgroundColor = val;
        group.querySelector('.color-hex').textContent = val;
        break;
      case 'toggle':
        group.querySelector('.toggle-track').classList.toggle('on', val);
        break;
    }
  });
}

function updateAll() {
  if (isOptionsMode) {
    updateOptionsMode();
    return;
  }

  (CONFIG.controls || []).forEach(c => {
    syncCssVar(c.id, state[c.id], c.unit);
    const valEl = document.getElementById(`val-${c.id}`);
    if (!valEl) return;
    const v = state[c.id];
    if (c.type === 'slider') valEl.textContent = v + (c.unit || '');
    else if (c.type === 'toggle') valEl.textContent = v ? 'On' : 'Off';
    else valEl.textContent = String(v);
  });

  const previewEl = document.getElementById('preview');
  if (CONFIG.previewHtml) {
    previewEl.innerHTML = CONFIG.previewHtml;
  } else {
    const previewParts = (CONFIG.controls || []).map(c => {
      const v = state[c.id];
      let display = '';
      if (c.type === 'toggle') display = v ? 'Yes' : 'No';
      else if (c.type === 'slider') display = v + (c.unit || '');
      else if (c.type === 'color') display = `<span class="preview-swatch" style="background:${v}"></span>${v}`;
      else display = String(v);

      return `<div class="preview-row"><span>${c.label}</span><span class="preview-value">${display}</span></div>`;
    });

    previewEl.innerHTML = `<div class="preview-summary">${previewParts.join('')}</div>`;
  }

  const promptParts = (CONFIG.controls || []).map(c => {
    const v = state[c.id];
    const display = c.type === 'toggle' ? (v ? 'Yes' : 'No') : c.type === 'slider' ? v + (c.unit || '') : String(v);
    return `${c.label}: ${display}`;
  });

  document.getElementById('prompt-text').textContent = promptParts.join('\n');
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
}

function handleSend(btnId, textId) {
  const text = document.getElementById(textId).textContent;
  window.parent.postMessage({ type: 'a2ui-send', text }, '*');

  const btn = document.getElementById(btnId);
  const label = btn.querySelector('span');
  if (!label) return;

  btn.classList.add('sent');
  label.textContent = 'Sent';

  if (btn.dataset.resetTimer) {
    clearTimeout(Number(btn.dataset.resetTimer));
  }

  const timer = window.setTimeout(() => {
    btn.classList.remove('sent');
    label.textContent = 'Send to Chat';
  }, 1500);

  btn.dataset.resetTimer = String(timer);
}

document.getElementById('copy-btn').onclick = () => handleSend('copy-btn', 'prompt-text');
document.getElementById('options-copy-btn').onclick = () => handleSend('options-copy-btn', 'options-prompt-text');

init();
</script>
</body>
</html>
