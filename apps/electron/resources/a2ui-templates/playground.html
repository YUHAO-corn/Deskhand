<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A2UI Playground</title>
<style>
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #f5f8f7; --bg-card: #fff; --bg-muted: #eef4f2; --bg-surface: #f9fbfa;
    --text: #1b2a2a; --text-secondary: #5a6b6b; --text-muted: #8a9a9a;
    --accent: #10a37f; --accent-soft: #d4ede5; --accent-bg: #edf7f3;
    --accent-hover: #0d8f6e; --accent-glow: rgba(16,163,127,0.12);
    --border: #dce6e3; --border-light: #e8efec;
    --radius-sm: 8px; --radius-md: 10px; --radius-lg: 14px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 2px 8px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-accent: 0 2px 12px rgba(16,163,127,0.2);
    --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
    --mono: 'SF Mono', ui-monospace, monospace;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }
  body { font-family: var(--font); background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }

  /* Header */
  .header { padding: 14px 20px; background: var(--bg-card); border-bottom: 1px solid var(--border-light); animation: fadeIn 0.3s var(--ease); }
  .header-content { display: flex; align-items: center; gap: 10px; }
  .header-icon { width: 28px; height: 28px; border-radius: var(--radius-sm); background: var(--accent-bg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .header-text h1 { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  .header-text p { font-size: 12px; color: var(--text-muted); margin-top: 1px; }

  /* Layout */
  .main { flex: 1; display: flex; overflow: hidden; }
  .controls { width: 260px; flex-shrink: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; background: var(--bg-card); border-right: 1px solid var(--border-light); }
  .preview-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .preview-content { flex: 1; overflow: auto; padding: 20px; background: var(--bg); }

  /* Presets */
  .presets { display: flex; flex-wrap: wrap; gap: 6px; }
  .preset-btn { padding: 5px 12px; font-size: 12px; border-radius: 100px; border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-secondary); cursor: pointer; transition: all 0.2s var(--ease); font-family: var(--font); font-weight: 500; }
  .preset-btn:hover { background: var(--accent-bg); color: var(--accent); border-color: var(--accent-soft); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
  .preset-btn.active { background: var(--accent); border-color: var(--accent); color: white; box-shadow: var(--shadow-accent); }

  /* Options mode */
  .options-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; padding: 16px; }
  .option-card { padding: 16px; border-radius: var(--radius-lg); border: 2px solid var(--border); background: var(--bg-card); cursor: pointer; transition: all 0.2s var(--ease); animation: fadeIn 0.3s var(--ease) both; text-align: center; }
  .option-card:hover { border-color: var(--accent-soft); transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .option-card.selected { border-color: var(--accent); background: var(--accent-bg); box-shadow: var(--shadow-accent); }
  .option-emoji { font-size: 28px; margin-bottom: 8px; line-height: 1; }
  .option-preview { margin-bottom: 10px; border-radius: var(--radius-sm); overflow: hidden; }
  .option-label { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
  .option-desc { font-size: 11px; color: var(--text-muted); line-height: 1.4; }
  .option-check { display: none; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); margin: 0 auto 8px; align-items: center; justify-content: center; }
  .option-card.selected .option-check { display: flex; }

  /* Options layout: gallery left, preview right */
  .options-layout { flex: 1; display: flex; overflow: hidden; }
  .options-sidebar { width: 320px; flex-shrink: 0; overflow-y: auto; background: var(--bg-card); border-right: 1px solid var(--border-light); display: flex; flex-direction: column; }
  .options-controls { padding: 12px 16px; border-top: 1px solid var(--border-light); }
</style>
</head>
<body>
<div class="header"><div class="header-content">
  <div class="header-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="6" height="6" rx="1.5" fill="var(--accent)" opacity=".7"/><rect x="9" y="1" width="6" height="6" rx="1.5" fill="var(--accent)" opacity=".4"/><rect x="1" y="9" width="6" height="6" rx="1.5" fill="var(--accent)" opacity=".4"/><rect x="9" y="9" width="6" height="6" rx="1.5" fill="var(--accent)" opacity=".2"/></svg></div>
  <div class="header-text"><h1 id="title"></h1><p id="description"></p></div>
</div></div>
<div class="main" id="controls-layout">
  <div class="controls"><div id="presets-container"></div><div id="controls-container"></div></div>
  <div class="preview-area">
    <div id="preview" class="preview-content"></div>
    <div class="prompt-bar"><div class="prompt-inner">
      <div id="prompt-text" class="prompt-text"></div>
      <button id="copy-btn" class="send-btn"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="flex-shrink:0"><path d="M1 7h9.5M7.5 3.5L11 7l-3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Send to Chat</span></button>
    </div></div>
  </div>
</div>
<div class="main options-layout" id="options-layout" style="display:none">
  <div class="options-sidebar">
    <div id="options-grid" class="options-grid"></div>
    <div id="options-controls" class="options-controls" style="display:none">
      <div id="options-controls-container"></div>
    </div>
  </div>
  <div class="preview-area">
    <div id="options-preview" class="preview-content"></div>
    <div class="prompt-bar"><div class="prompt-inner">
      <div id="options-prompt-text" class="prompt-text"></div>
      <button id="options-copy-btn" class="send-btn"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="flex-shrink:0"><path d="M1 7h9.5M7.5 3.5L11 7l-3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Send to Chat</span></button>
    </div></div>
  </div>
</div>

<style>
  /* Control group */
  .control-group { margin-bottom: 2px; padding: 10px 12px; border-radius: var(--radius-md); transition: background 0.15s var(--ease); animation: slideIn 0.3s var(--ease) both; }
  .control-group:hover { background: var(--bg-surface); }
  .control-group label { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; font-weight: 500; }
  .control-group .value { font-family: var(--mono); font-size: 11px; color: var(--accent); background: var(--accent-bg); padding: 1px 6px; border-radius: 4px; font-weight: 500; }

  /* Slider */
  input[type="range"] { width: 100%; height: 5px; -webkit-appearance: none; appearance: none; background: var(--border); border-radius: 3px; outline: none; transition: opacity 0.15s; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; background: white; border: 2px solid var(--accent); border-radius: 50%; cursor: pointer; box-shadow: var(--shadow-md); transition: transform 0.15s var(--ease), box-shadow 0.15s; }
  input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); box-shadow: var(--shadow-accent); }
  input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.1); }

  /* Select */
  select { width: 100%; padding: 8px 12px; font-size: 13px; background: var(--bg-surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-sm); outline: none; cursor: pointer; font-family: var(--font); transition: border-color 0.15s, box-shadow 0.15s; }
  select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

  /* Color picker */
  .color-picker-wrap { display: flex; align-items: center; gap: 10px; }
  .color-swatch { width: 32px; height: 32px; border-radius: var(--radius-sm); border: 2px solid var(--border); cursor: pointer; position: relative; overflow: hidden; transition: border-color 0.15s, transform 0.15s; box-shadow: var(--shadow-sm); }
  .color-swatch:hover { border-color: var(--accent); transform: scale(1.05); }
  .color-swatch input { opacity: 0; position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; }
  .color-hex { font-family: var(--mono); font-size: 12px; color: var(--text-muted); }

  /* Toggle */
  .toggle-wrap { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .toggle-track { width: 38px; height: 22px; border-radius: 11px; background: var(--border); position: relative; transition: background 0.2s var(--ease); flex-shrink: 0; }
  .toggle-track.on { background: var(--accent); }
  .toggle-thumb { width: 18px; height: 18px; border-radius: 50%; background: white; position: absolute; top: 2px; left: 2px; transition: transform 0.2s var(--ease); box-shadow: var(--shadow-sm); }
  .toggle-track.on .toggle-thumb { transform: translateX(16px); }
  .toggle-label { font-size: 13px; color: var(--text); }

  /* Prompt bar */
  .prompt-bar { border-top: 1px solid var(--border-light); padding: 12px 16px; background: var(--bg-card); }
  .prompt-inner { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--bg-surface); border-radius: var(--radius-md); border: 1px solid var(--border-light); }
  .prompt-text { flex: 1; font-size: 12px; color: var(--text-muted); font-family: var(--mono); white-space: pre-wrap; max-height: 72px; overflow-y: auto; line-height: 1.5; }
  .send-btn { display: flex; align-items: center; gap: 6px; padding: 7px 14px; font-size: 12px; background: var(--accent); color: white; border: none; border-radius: var(--radius-sm); cursor: pointer; flex-shrink: 0; font-family: var(--font); font-weight: 600; transition: all 0.2s var(--ease); letter-spacing: -0.01em; }
  .send-btn:hover { background: var(--accent-hover); box-shadow: var(--shadow-accent); transform: translateY(-1px); }
  .send-btn:active { transform: translateY(0); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.08); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.15); }
</style>

<script>
const CONFIG = window.__A2UI_CONFIG__ || {};
const state = {};
const isOptionsMode = CONFIG.options && CONFIG.options.length > 0;

function init() {
  document.getElementById('title').textContent = CONFIG.title || 'Playground';
  const descEl = document.getElementById('description');
  if (CONFIG.description) descEl.textContent = CONFIG.description;
  else descEl.style.display = 'none';

  // Initialize control state
  (CONFIG.controls || []).forEach(c => { state[c.id] = c.defaultValue; });

  if (isOptionsMode) {
    // Options mode: show gallery layout
    document.getElementById('controls-layout').style.display = 'none';
    document.getElementById('options-layout').style.display = 'flex';
    state.selected = CONFIG.options[0].id;
    state.selectedLabel = CONFIG.options[0].label;
    renderOptions();
    // Render optional controls in options sidebar
    if (CONFIG.controls && CONFIG.controls.length > 0) {
      document.getElementById('options-controls').style.display = 'block';
      renderControlsInto(document.getElementById('options-controls-container'));
    }
    updateOptionsMode();
  } else {
    // Controls mode: existing behavior
    renderPresets();
    renderControlsInto(document.getElementById('controls-container'));
    updateAll();
  }
}

function renderOptions() {
  const grid = document.getElementById('options-grid');
  CONFIG.options.forEach((opt, i) => {
    const card = document.createElement('div');
    card.className = 'option-card' + (i === 0 ? ' selected' : '');
    card.dataset.optionId = opt.id;
    card.style.animationDelay = (i * 0.06) + 's';

    // Check mark
    const check = document.createElement('div');
    check.className = 'option-check';
    check.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>';
    card.appendChild(check);

    // Emoji
    if (opt.emoji) {
      const emoji = document.createElement('div');
      emoji.className = 'option-emoji';
      emoji.textContent = opt.emoji;
      card.appendChild(emoji);
    }

    // Preview HTML
    if (opt.previewHtml) {
      const preview = document.createElement('div');
      preview.className = 'option-preview';
      preview.innerHTML = opt.previewHtml;
      card.appendChild(preview);
    }

    // Label
    const label = document.createElement('div');
    label.className = 'option-label';
    label.textContent = opt.label;
    card.appendChild(label);

    // Description
    if (opt.description) {
      const desc = document.createElement('div');
      desc.className = 'option-desc';
      desc.textContent = opt.description;
      card.appendChild(desc);
    }

    card.onclick = () => {
      state.selected = opt.id;
      state.selectedLabel = opt.label;
      grid.querySelectorAll('.option-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      updateOptionsMode();
    };

    grid.appendChild(card);
  });
}

function updateOptionsMode() {
  // Update preview
  if (CONFIG.previewTemplate) {
    document.getElementById('options-preview').innerHTML = fillTemplate(CONFIG.previewTemplate);
  }
  // Update prompt
  if (CONFIG.promptTemplate) {
    document.getElementById('options-prompt-text').textContent = fillTemplate(CONFIG.promptTemplate);
  }
  // Update control value displays
  (CONFIG.controls || []).forEach(c => {
    const valEl = document.getElementById(`val-${c.id}`);
    if (!valEl) return;
    const v = state[c.id];
    if (c.type === 'slider') valEl.textContent = v + (c.unit || '');
    else if (c.type === 'toggle') valEl.textContent = v ? 'On' : 'Off';
    else valEl.textContent = String(v);
  });
}

function renderPresets() {
  const container = document.getElementById('presets-container');
  if (!CONFIG.presets || CONFIG.presets.length === 0) { container.style.display = 'none'; return; }
  const wrap = document.createElement('div');
  wrap.className = 'presets';
  CONFIG.presets.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'preset-btn';
    btn.textContent = p.name;
    btn.title = p.description || '';
    btn.onclick = () => {
      Object.entries(p.values).forEach(([k, v]) => { state[k] = v; });
      syncControlsToState();
      updateAll();
      container.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
    wrap.appendChild(btn);
  });
  container.appendChild(wrap);
}

function renderControlsInto(container) {
  (CONFIG.controls || []).forEach((c, i) => {
    const group = document.createElement('div');
    group.className = 'control-group';
    group.dataset.controlId = c.id;
    group.style.animationDelay = (i * 0.05) + 's';

    if (c.type !== 'toggle') {
      const label = document.createElement('label');
      label.innerHTML = `${c.label}<span class="value" id="val-${c.id}"></span>`;
      group.appendChild(label);
    }

    switch (c.type) {
      case 'slider': {
        const input = document.createElement('input');
        input.type = 'range'; input.min = c.min; input.max = c.max;
        input.step = c.step || 1; input.value = c.defaultValue;
        const updateFill = () => {
          const pct = ((input.value - c.min) / (c.max - c.min)) * 100;
          input.style.background = `linear-gradient(to right, var(--accent) ${pct}%, var(--border) ${pct}%)`;
        };
        input.oninput = () => { state[c.id] = Number(input.value); updateFill(); updateAll(); };
        group.appendChild(input);
        setTimeout(updateFill, 0);
        break;
      }
      case 'select': {
        const input = document.createElement('select');
        c.options.forEach(o => {
          const opt = document.createElement('option');
          opt.value = o.value; opt.textContent = o.label;
          if (o.value === c.defaultValue) opt.selected = true;
          input.appendChild(opt);
        });
        input.onchange = () => { state[c.id] = input.value; updateAll(); };
        group.appendChild(input);
        break;
      }
      case 'color': {
        const wrap = document.createElement('div'); wrap.className = 'color-picker-wrap';
        const swatch = document.createElement('div'); swatch.className = 'color-swatch';
        swatch.style.backgroundColor = c.defaultValue;
        const input = document.createElement('input');
        input.type = 'color'; input.value = c.defaultValue;
        const hex = document.createElement('span'); hex.className = 'color-hex';
        hex.textContent = c.defaultValue;
        input.oninput = () => {
          state[c.id] = input.value; swatch.style.backgroundColor = input.value;
          hex.textContent = input.value; updateAll();
        };
        swatch.appendChild(input); wrap.appendChild(swatch); wrap.appendChild(hex);
        group.appendChild(wrap);
        break;
      }
      case 'toggle': {
        const wrap = document.createElement('div'); wrap.className = 'toggle-wrap';
        const track = document.createElement('div');
        track.className = 'toggle-track' + (c.defaultValue ? ' on' : '');
        const thumb = document.createElement('div'); thumb.className = 'toggle-thumb';
        track.appendChild(thumb);
        const lbl = document.createElement('span'); lbl.className = 'toggle-label';
        lbl.textContent = c.label;
        wrap.appendChild(track); wrap.appendChild(lbl);
        wrap.onclick = () => { state[c.id] = !state[c.id]; track.classList.toggle('on', state[c.id]); updateAll(); };
        group.appendChild(wrap);
        break;
      }
    }
    container.appendChild(group);
  });
}

function syncControlsToState() {
  (CONFIG.controls || []).forEach(c => {
    const group = document.querySelector(`[data-control-id="${c.id}"]`);
    if (!group) return;
    const val = state[c.id];
    switch (c.type) {
      case 'slider': {
        const input = group.querySelector('input');
        input.value = val;
        const pct = ((val - c.min) / (c.max - c.min)) * 100;
        input.style.background = `linear-gradient(to right, var(--accent) ${pct}%, var(--border) ${pct}%)`;
        break;
      }
      case 'select': group.querySelector('select').value = val; break;
      case 'color': {
        group.querySelector('input').value = val;
        group.querySelector('.color-swatch').style.backgroundColor = val;
        group.querySelector('.color-hex').textContent = val;
        break;
      }
      case 'toggle': group.querySelector('.toggle-track').classList.toggle('on', val); break;
    }
  });
}

function fillTemplate(template) {
  return template.replace(/\{\{(\w+)\}\}/g, (_, id) => {
    const val = state[id];
    return val !== undefined ? String(val) : `{{${id}}}`;
  });
}

function updateAll() {
  if (isOptionsMode) {
    updateOptionsMode();
    return;
  }
  (CONFIG.controls || []).forEach(c => {
    const valEl = document.getElementById(`val-${c.id}`);
    if (!valEl) return;
    const v = state[c.id];
    if (c.type === 'slider') valEl.textContent = v + (c.unit || '');
    else if (c.type === 'toggle') valEl.textContent = v ? 'On' : 'Off';
    else valEl.textContent = String(v);
  });
  if (CONFIG.previewTemplate) {
    document.getElementById('preview').innerHTML = fillTemplate(CONFIG.previewTemplate);
  }
  if (CONFIG.promptTemplate) {
    document.getElementById('prompt-text').textContent = fillTemplate(CONFIG.promptTemplate);
  }
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
}

function handleSend(btnId, textId) {
  const text = document.getElementById(textId).textContent;
  window.parent.postMessage({ type: 'a2ui-send', text }, '*');
  const btn = document.getElementById(btnId);
  btn.querySelector('span').textContent = '✓ Sent!';
  setTimeout(() => { btn.querySelector('span').textContent = 'Send to Chat'; }, 1500);
}

document.getElementById('copy-btn').onclick = () => handleSend('copy-btn', 'prompt-text');
document.getElementById('options-copy-btn').onclick = () => handleSend('options-copy-btn', 'options-prompt-text');

init();
</script>
</body>
</html>
