<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>InputToolbar 线框图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, sans-serif;
    background: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    height: 100vh;
    padding: 40px;
  }
  .container { width: 580px; padding: 0 24px 28px; position: relative; }

  /* 主输入框 */
  .input-box {
    background: white;
    border-radius: 16px;
    border: 1.5px solid #ccc;
    position: relative;
  }
  textarea {
    width: 100%;
    border: none; outline: none; resize: none;
    font-size: 14px; padding: 16px 18px 12px;
    background: transparent; color: #333;
    min-height: 56px;
  }
  .inner-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 10px 8px;
  }
  .inner-left { display: flex; align-items: center; gap: 2px; }

  /* 通用按钮 */
  .ib {
    width: 28px; height: 28px;
    border: 1.5px solid #bbb; background: white;
    border-radius: 7px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: #666;
    position: relative;
  }
  .ib:hover { border-color: #888; color: #333; }
  .ib.active { border-color: #333; color: #333; background: #f5f5f5; }
  .send-btn {
    width: 28px; height: 28px;
    border: 1.5px solid #333; background: #333;
    border-radius: 7px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 13px; font-weight: bold;
  }

  /* 配置栏 */
  .outer-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 6px 0;
  }
  .outer-left { display: flex; align-items: center; gap: 2px; }
  .outer-right { display: flex; align-items: center; }
  .cb {
    display: flex; align-items: center; gap: 4px;
    padding: 4px 10px; border: 1px solid transparent;
    background: transparent; border-radius: 6px;
    cursor: pointer; font-size: 11px; color: #888;
    white-space: nowrap; position: relative;
  }
  .cb:hover { background: #e8e8e8; color: #555; }
  .cb.active { background: #e8e8e8; color: #333; border-color: #ccc; }

  /* 弹窗 */
  .popup {
    display: none;
    position: absolute;
    background: white;
    border: 1.5px solid #ccc;
    border-radius: 10px;
    padding: 6px;
    min-width: 200px;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.12);
  }
  .popup.show { display: block; }
  .popup-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border-radius: 6px;
    cursor: pointer; font-size: 13px; color: #333;
    border: none; background: none; width: 100%;
    text-align: left;
  }
  .popup-item:hover { background: #f0f0f0; }
  .popup-item .label { flex: 1; }
  .popup-item .hint { font-size: 11px; color: #aaa; }
  .popup-item .icon-placeholder {
    width: 20px; height: 20px;
    border: 1px solid #bbb; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: #999;
  }
  .divider { height: 1px; background: #eee; margin: 4px 8px; }
  .popup-header {
    font-size: 11px; color: #aaa;
    padding: 6px 12px 4px; font-weight: 500;
  }
  .back-btn {
    width: 22px; height: 22px;
    border: 1px solid #ccc; background: white;
    border-radius: 5px; cursor: pointer;
    font-size: 12px; color: #888;
    display: flex; align-items: center; justify-content: center;
  }
  .back-btn:hover { border-color: #888; color: #333; }

  /* 弹窗定位 */
  .popup-above {
    bottom: calc(100% + 6px);
    left: 0;
  }
  .popup-above-right {
    bottom: calc(100% + 6px);
    right: 0;
  }

  /* 遮罩 */
  .overlay {
    display: none;
    position: fixed; inset: 0;
    z-index: 50;
  }
  .overlay.show { display: block; }

  /* 标签 */
  .btn-label {
    position: absolute;
    bottom: -18px; left: 50%;
    transform: translateX(-50%);
    font-size: 9px; color: #aaa;
    white-space: nowrap;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="container">

  <!-- 遮罩层 -->
  <div class="overlay" id="overlay" onclick="closeAll()"></div>

  <!-- 主输入框 -->
  <div class="input-box" style="position:relative;">

    <!-- ===== 弹窗们（定位在输入框内，向上弹出） ===== -->

    <!-- + 按钮弹窗 -->
    <div class="popup" id="popup-plus" style="bottom:calc(100% + 6px); left:8px;">
      <div class="popup-header">Attach</div>
      <button class="popup-item" onclick="closeAll()">
        <span class="icon-placeholder">[]</span>
        <span class="label">Upload files</span>
      </button>
      <button class="popup-item" onclick="showSub('clipboard')">
        <span class="icon-placeholder">cb</span>
        <span class="label">Clipboard history</span>
        <span class="hint">></span>
      </button>
      <div class="divider"></div>
      <div class="popup-header">Skills</div>
      <button class="popup-item" onclick="showSub('skills')">
        <span class="icon-placeholder">sk</span>
        <span class="label">Skills</span>
        <span class="hint">4 installed ></span>
      </button>
      <div class="divider"></div>
      <div class="popup-header">MCP</div>
      <button class="popup-item" onclick="showSub('mcp')">
        <span class="icon-placeholder">mc</span>
        <span class="label">MCP Connections</span>
        <span class="hint">2 servers ></span>
      </button>
    </div>

    <!-- Interact 按钮弹窗 -->
    <div class="popup" id="popup-interact" style="bottom:calc(100% + 6px); left:38px;">
      <div class="popup-header">Interact mode</div>
      <button class="popup-item" onclick="closeAll()">
        <span class="icon-placeholder">ps</span>
        <span class="label">Pick a Style</span>
      </button>
      <button class="popup-item" onclick="closeAll()">
        <span class="icon-placeholder">tt</span>
        <span class="label">This or That</span>
      </button>
    </div>

    <!-- ===== 二级子面板 ===== -->

    <!-- Clipboard history 子面板 -->
    <div class="popup" id="popup-sub-clipboard" style="bottom:calc(100% + 6px); left:8px; min-width:260px;">
      <div style="display:flex; align-items:center; gap:6px; padding:6px 12px 4px;">
        <button class="back-btn" onclick="backToPlus()">&lt;</button>
        <span class="popup-header" style="padding:0;">Clipboard history</span>
      </div>
      <div class="divider"></div>
      <div class="popup-header">Just now</div>
      <button class="popup-item" onclick="closeAll()">
        <span class="icon-placeholder">T</span>
        <span class="label">const handleClick = () =&gt; ...</span>
        <span class="hint">482 chars</span>
      </button>
      <button class="popup-item" onclick="closeAll()">
        <span class="icon-placeholder">T</span>
        <span class="label">https://api.example.com/v2</span>
        <span class="hint">link</span>
      </button>
      <div class="popup-header">Earlier</div>
      <button class="popup-item" onclick="closeAll()">
        <span class="icon-placeholder">I</span>
        <span class="label">Screenshot 2026-03-05</span>
        <span class="hint">image</span>
      </button>
    </div>

    <!-- Skills 子面板 -->
    <div class="popup" id="popup-sub-skills" style="bottom:calc(100% + 6px); left:8px; min-width:260px;">
      <div style="display:flex; align-items:center; gap:6px; padding:6px 12px 4px;">
        <button class="back-btn" onclick="backToPlus()">&lt;</button>
        <span class="popup-header" style="padding:0;">Skills</span>
      </div>
      <div class="divider"></div>
      <button class="popup-item" onclick="closeAll()">
        <span class="icon-placeholder">on</span>
        <span class="label">playground</span>
        <span class="hint">active</span>
      </button>
      <button class="popup-item" onclick="closeAll()">
        <span class="icon-placeholder">on</span>
        <span class="label">frontend-design</span>
        <span class="hint">active</span>
      </button>
      <button class="popup-item" onclick="closeAll()">
        <span class="icon-placeholder">on</span>
        <span class="label">find-skills</span>
        <span class="hint">active</span>
      </button>
      <button class="popup-item" onclick="closeAll()">
        <span class="icon-placeholder">on</span>
        <span class="label">skill-creator</span>
        <span class="hint">active</span>
      </button>
      <div class="divider"></div>
      <button class="popup-item" onclick="closeAll()">
        <span class="icon-placeholder">+</span>
        <span class="label">Install skill...</span>
      </button>
    </div>

    <!-- MCP 子面板 -->
    <div class="popup" id="popup-sub-mcp" style="bottom:calc(100% + 6px); left:8px; min-width:280px;">
      <div style="display:flex; align-items:center; gap:6px; padding:6px 12px 4px;">
        <button class="back-btn" onclick="backToPlus()">&lt;</button>
        <span class="popup-header" style="padding:0;">MCP Connections</span>
      </div>
      <div class="divider"></div>
      <div class="popup-header">Connected</div>
      <button class="popup-item" onclick="closeAll()">
        <span class="icon-placeholder">--</span>
        <span class="label">Figma</span>
        <span class="hint">3 tools</span>
      </button>
      <button class="popup-item" onclick="closeAll()">
        <span class="icon-placeholder">--</span>
        <span class="label">Linear</span>
        <span class="hint">5 tools</span>
      </button>
      <div class="divider"></div>
      <button class="popup-item" onclick="closeAll()">
        <span class="icon-placeholder">+</span>
        <span class="label">Add MCP server...</span>
      </button>
    </div>

    <textarea placeholder="Type a message..." rows="2"></textarea>

    <div class="inner-bar">
      <div class="inner-left">
        <button class="ib" id="btn-plus" onclick="toggle('plus')" title="Attach & Tools">
          +
          <span class="btn-label">attach</span>
        </button>
        <button class="ib" id="btn-interact" onclick="toggle('interact')" title="Interact mode">
          /
          <span class="btn-label">interact</span>
        </button>
      </div>
      <button class="send-btn" title="Send">↑</button>
    </div>
  </div>

  <!-- 配置栏（输入框外下方） -->
  <div class="outer-bar" style="position:relative;">

    <!-- Workspace 弹窗 -->
    <div class="popup" id="popup-workspace" style="bottom:calc(100% + 4px); left:0; min-width:220px;">
      <div class="popup-header">Working directory</div>
      <button class="popup-item" style="background:#f0f0f0;">
        <span class="icon-placeholder">/</span>
        <span class="label">~/cursor/Deskhand</span>
        <span class="hint">current</span>
      </button>
      <div class="divider"></div>
      <button class="popup-item">
        <span class="icon-placeholder">+</span>
        <span class="label">Choose directory...</span>
      </button>
    </div>

    <!-- Permission 弹窗 -->
    <div class="popup" id="popup-permission" style="bottom:calc(100% + 4px); left:100px; min-width:200px;">
      <div class="popup-header">Permission mode</div>
      <button class="popup-item" style="background:#f0f0f0;">
        <span class="icon-placeholder">*</span>
        <span class="label">Ask</span>
        <span class="hint">confirms dangerous ops</span>
      </button>
      <button class="popup-item">
        <span class="icon-placeholder">&nbsp;</span>
        <span class="label">Auto</span>
        <span class="hint">only confirms deletes</span>
      </button>
    </div>

    <!-- Model 弹窗 -->
    <div class="popup" id="popup-model" style="bottom:calc(100% + 4px); right:0; min-width:200px;">
      <div class="popup-header">Model</div>
      <button class="popup-item" style="background:#f0f0f0;">
        <span class="icon-placeholder">*</span>
        <span class="label">Opus 4.5</span>
      </button>
      <button class="popup-item">
        <span class="icon-placeholder">&nbsp;</span>
        <span class="label">Sonnet 4.5</span>
      </button>
      <button class="popup-item">
        <span class="icon-placeholder">&nbsp;</span>
        <span class="label">Haiku 4.5</span>
      </button>
    </div>

    <div class="outer-left">
      <button class="cb" id="btn-workspace" onclick="toggle('workspace')">
        Deskhand <span style="font-size:9px;color:#bbb;">▾</span>
      </button>
      <button class="cb" id="btn-permission" onclick="toggle('permission')">
        Ask <span style="font-size:9px;color:#bbb;">▾</span>
      </button>
    </div>
    <div class="outer-right">
      <button class="cb" id="btn-model" onclick="toggle('model')">
        Opus 4.5 <span style="font-size:9px;color:#bbb;">▾</span>
      </button>
    </div>
  </div>
</div>

<script>
  let current = null;
  function toggle(name) {
    if (current === name) { closeAll(); return; }
    closeAll();
    current = name;
    document.getElementById('popup-' + name).classList.add('show');
    document.getElementById('btn-' + name).classList.add('active');
    document.getElementById('overlay').classList.add('show');
  }
  function showSub(name) {
    // 隐藏 + 菜单，显示子面板
    document.getElementById('popup-plus').classList.remove('show');
    document.getElementById('popup-sub-' + name).classList.add('show');
  }
  function backToPlus() {
    // 隐藏所有子面板，回到 + 菜单
    document.querySelectorAll('[id^="popup-sub-"]').forEach(p => p.classList.remove('show'));
    document.getElementById('popup-plus').classList.add('show');
  }
  function closeAll() {
    current = null;
    document.querySelectorAll('.popup').forEach(p => p.classList.remove('show'));
    document.querySelectorAll('.ib,.cb').forEach(b => b.classList.remove('active'));
    document.getElementById('overlay').classList.remove('show');
  }
</script>
</body>
</html>
